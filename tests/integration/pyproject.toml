[project]
name = "integration-tests"
version = "0.1.0"
description = "Integration tests: running backend + local Supabase + demo AI"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
