services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside the container, local Supabase is reached via the host.
      # Set COMPOSE_SUPABASE_URL / COMPOSE_DATABASE_URL in .env to use a hosted project.
      SUPABASE_URL: ${COMPOSE_SUPABASE_URL:-http://host.docker.internal:54321}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # Browsers load Storage images from the URL in .env, not the container-internal one.
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
