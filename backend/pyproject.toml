[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Acupressure Recommendation App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
