[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Acupressure Recommendation App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
