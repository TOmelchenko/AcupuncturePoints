name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start local Supabase and apply SQL scripts
        timeout-minutes: 10
        working-directory: .
        run: |
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          make db-setup
          supabase status -o env | grep -E '^(SERVICE_ROLE_KEY|ANON_KEY)=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest
        env:
          REQUIRE_DB: "1"

  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start local Supabase and apply SQL scripts
        timeout-minutes: 10
        working-directory: .
        run: |
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,gotrue,kong,postgrest,storage-api
          make db-setup
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ingestion tests
      - run: uv run pytest
        env:
          REQUIRE_DB: "1"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start local Supabase
        timeout-minutes: 10
        run: |
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          supabase status -o env | grep -E '^(SERVICE_ROLE_KEY|ANON_KEY)=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - run: cd backend && uv sync --frozen
      - run: cd tests/integration && uv sync --frozen
      - run: make lint-integration
      - run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start local Supabase
        timeout-minutes: 10
        run: |
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase status -o env | grep -E '^(SERVICE_ROLE_KEY|ANON_KEY)=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t acupressure-backend backend
      - name: Build frontend image
        run: docker build --target prod -t acupressure-frontend frontend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for secret detection
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Python dependency audit (pip-audit)
        run: make audit-backend audit-ingestion
      - name: npm dependency audit (high and critical)
        run: make audit-frontend
      - name: Secret detection (gitleaks)
        run: make secrets
