# Render Blueprint: development and production environments on Render's free plan.
#
# Each environment has a FastAPI backend (Docker web service) and a static frontend.
# Deploys are triggered by GitHub Actions, not by Render: development after CI
# passes on main (.github/workflows/deploy-dev.yml), production manually with
# approval (.github/workflows/deploy-prod.yml). Values marked `sync: false` are
# secrets you enter in the Render dashboard; see _docs/deployment.md.

services:
  # ---------------------------------------------------------------- development
  - type: web
    name: acupressure-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: AI_PROVIDER
        value: anthropic
      # Claude on the Anthropic API, embeddings from Voyage AI (the AWS account has no Bedrock quota).
      - key: ANTHROPIC_TEXT_MODEL_ID
        value: claude-haiku-4-5
      - key: VOYAGE_EMBEDDING_MODEL_ID
        value: voyage-3.5
      # Public origin: fromService `host` is Render's internal hostname, not the browser's origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://acupressure-web-dev.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

  - type: web
    name: acupressure-web-dev
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL: fromService `host` is Render's internal hostname, unreachable from browsers.
      - key: VITE_API_BASE_URL
        value: https://acupressure-api-dev.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ----------------------------------------------------------------- production
  - type: web
    name: acupressure-api-prod
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: AI_PROVIDER
        value: anthropic
      # Claude on the Anthropic API, embeddings from Voyage AI (the AWS account has no Bedrock quota).
      - key: ANTHROPIC_TEXT_MODEL_ID
        value: claude-haiku-4-5
      - key: VOYAGE_EMBEDDING_MODEL_ID
        value: voyage-3.5
      # Public origin: fromService `host` is Render's internal hostname, not the browser's origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://acupressure-web-prod.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

  - type: web
    name: acupressure-web-prod
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL: fromService `host` is Render's internal hostname, unreachable from browsers.
      - key: VITE_API_BASE_URL
        value: https://acupressure-api-prod.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
