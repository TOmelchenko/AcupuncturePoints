# Render Blueprint: development and production environments on Render's free plan.
#
# Each environment has a FastAPI backend (Docker web service) and a static frontend.
# Deploys are triggered by GitHub Actions, not by Render: development after CI
# passes on main (.github/workflows/deploy-dev.yml), production manually with
# approval (.github/workflows/deploy-prod.yml). Values marked `sync: false` are
# secrets you enter in the Render dashboard; see _docs/deployment.md.

services:
  # ---------------------------------------------------------------- development
  - type: web
    name: acupressure-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      # Temporarily `fake` (offline demo AI) until the AWS Bedrock quota is raised;
      # then set back to `bedrock` and re-ingest the knowledge base with real embeddings.
      - key: AI_PROVIDER
        value: fake
      - key: BEDROCK_TEXT_MODEL_ID
        value: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      - key: BEDROCK_EMBEDDING_MODEL_ID
        value: amazon.titan-embed-text-v2:0
      # Public origin: fromService `host` is Render's internal hostname, not the browser's origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://acupressure-web-dev.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: acupressure-web-dev
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL: fromService `host` is Render's internal hostname, unreachable from browsers.
      - key: VITE_API_BASE_URL
        value: https://acupressure-api-dev.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ----------------------------------------------------------------- production
  - type: web
    name: acupressure-api-prod
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: AI_PROVIDER
        value: bedrock
      - key: BEDROCK_TEXT_MODEL_ID
        value: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      - key: BEDROCK_EMBEDDING_MODEL_ID
        value: amazon.titan-embed-text-v2:0
      # Public origin: fromService `host` is Render's internal hostname, not the browser's origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://acupressure-web-prod.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: acupressure-web-prod
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL: fromService `host` is Render's internal hostname, unreachable from browsers.
      - key: VITE_API_BASE_URL
        value: https://acupressure-api-prod.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
